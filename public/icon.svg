<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#021427"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Stylized Dumbbell / Pulse Icon -->
  <g transform="translate(256, 256)">
    <!-- Outer Barbell Plates (Left) -->
    <rect x="-180" y="-80" width="32" height="160" rx="12" fill="url(#neonGrad)" filter="url(#glow)"/>
    <rect x="-140" y="-60" width="22" height="120" rx="8" fill="url(#neonGrad)"/>
    
    <!-- Outer Barbell Plates (Right) -->
    <rect x="148" y="-80" width="32" height="160" rx="12" fill="url(#neonGrad)" filter="url(#glow)"/>
    <rect x="118" y="-60" width="22" height="120" rx="8" fill="url(#neonGrad)"/>

    <!-- Barbell Connecting Shaft -->
    <rect x="-120" y="-12" width="240" height="24" rx="10" fill="#94a3b8"/>

    <!-- Center Pulse / Heartbeat Line in Shaft -->
    <path d="M -80 0 L -30 0 L -15 -42 L 8 48 L 28 -24 L 45 10 L 80 0" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Center Core Glow Point -->
    <circle cx="8" cy="48" r="6" fill="#4ade80" filter="url(#glow)"/>
  </g>
</svg>
